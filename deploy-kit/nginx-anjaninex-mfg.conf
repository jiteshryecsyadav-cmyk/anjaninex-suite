# ============================================================================
# Manufacturer app — mfg.vyaparsetu.anjaninex.com
# ============================================================================
# Jaan-boojh kar isi domain ke NEECHE rakha hai, alag domain par nahi:
# wildcard DNS (*.anjaninex.com) aur wildcard SSL (*.vyaparsetu.anjaninex.com)
# dono pehle se hain. mfg.anjaninex.com lete to naya cert lena padta.
#
# Ye block *.vyaparsetu.anjaninex.com wale se ZYADA KHAAS hai, isliye nginx
# isko pehle uthata hai — firm-subdomain wala block chhua bhi nahi jayega.
#
# ⚠️ "mfg" ab reserved naam hai — koi firm apna subdomain "mfg" nahi rakh sakti,
#    warna uska login page manufacturer app khol dega.
#
# Install:
#   sudo cp deploy-kit/nginx-anjaninex-mfg.conf /etc/nginx/sites-available/anjaninex-mfg
#   sudo ln -sf /etc/nginx/sites-available/anjaninex-mfg /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# ============================================================================

server {
    listen 80;
    server_name mfg.vyaparsetu.anjaninex.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name mfg.vyaparsetu.anjaninex.com;

    ssl_certificate     /etc/ssl/vyaparsetu/wild.pem;
    ssl_certificate_key /etc/ssl/vyaparsetu/wild.key;

    root /var/www/anjaninex-mfg;
    index index.html;
    client_max_body_size 25m;

    # ^~ zaroori hai — bina iske *.jpg wala regex block /api/ ko haraa deta hai
    # aur photo 404 hone lagti hai (agency app me ye ek baar ho chuka hai)
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:5005;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    include snippets/anjaninex-cache.conf;

    # Angular ke andar ke rasta — sab index.html par
    location / {
        try_files $uri $uri/ /index.html;
    }
}
