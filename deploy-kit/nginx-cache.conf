# 🔄 UPDATE hamesha phone tak pahunche
# index.html / ngsw.json / ngsw-worker.js par koi cache-rule nahi thi, isliye phone
# purani copy pakde rehta tha aur nayi build ka pata hi nahi chalta tha.
location = /index.html          { add_header Cache-Control "no-cache, no-store, must-revalidate"; }
location = /ngsw.json           { add_header Cache-Control "no-cache, no-store, must-revalidate"; }
location = /ngsw-worker.js      { add_header Cache-Control "no-cache, no-store, must-revalidate"; }
location = /safety-worker.js    { add_header Cache-Control "no-cache, no-store, must-revalidate"; }
location = /manifest.webmanifest { add_header Cache-Control "no-cache"; }

# Hashed files (main-A1B2C3.js) — inka NAAM hi har build me badalta hai,
# isliye inhe saal bhar cache karna theek hai (app tez khulta hai).
location ~* \.(?:js|css|woff2?|ttf|eot|png|jpe?g|gif|svg|webp|ico)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
}
